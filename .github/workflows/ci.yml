name: Structure checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Check Python syntax
        run: python -m compileall -q src
      - name: Check example JSON syntax
        run: |
          python -m json.tool configs/vlans.json > /dev/null
          python -m json.tool policies/campus.json > /dev/null

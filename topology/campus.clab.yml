name: campus-acl

topology:
  defaults:
    kind: linux
    image: campus-acl-router:1.0
    image-pull-policy: Never
    restart-policy: "no"
    privileged: false
    cap-add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "0"

  nodes:
    router:
      sysctls:
        net.ipv4.ip_forward: "1"
      exec:
        - ip link set dev eth1 up
        - ip link add link eth1 name eth1.10 type vlan id 10
        - ip address replace 10.10.10.1/24 dev eth1.10
        - ip link set dev eth1.10 up
        - ip link add link eth1 name eth1.20 type vlan id 20
        - ip address replace 10.10.20.1/24 dev eth1.20
        - ip link set dev eth1.20 up
        - ip link add link eth1 name eth1.30 type vlan id 30
        - ip address replace 10.10.30.1/24 dev eth1.30
        - ip link set dev eth1.30 up
        - ip link add link eth1 name eth1.40 type vlan id 40
        - ip address replace 10.10.40.1/24 dev eth1.40
        - ip link set dev eth1.40 up

    switch:
      exec:
        - ip link add name br0 type bridge vlan_filtering 1 vlan_default_pvid 0
        - ip link set dev br0 up
        - ip link set dev eth1 master br0
        - ip link set dev eth2 master br0
        - ip link set dev eth3 master br0
        - ip link set dev eth4 master br0
        - ip link set dev eth5 master br0
        - bridge vlan add dev eth1 vid 10
        - bridge vlan add dev eth1 vid 20
        - bridge vlan add dev eth1 vid 30
        - bridge vlan add dev eth1 vid 40
        - bridge vlan add dev eth2 vid 10 pvid untagged
        - bridge vlan add dev eth3 vid 20 pvid untagged
        - bridge vlan add dev eth4 vid 30 pvid untagged
        - bridge vlan add dev eth5 vid 40 pvid untagged
        - ip link set dev eth1 up
        - ip link set dev eth2 up
        - ip link set dev eth3 up
        - ip link set dev eth4 up
        - ip link set dev eth5 up

    staff:
      exec:
        - ip address replace 10.10.10.10/24 dev eth1
        - ip link set dev eth1 up
        - ip route replace default via 10.10.10.1 dev eth1

    guest:
      exec:
        - ip address replace 10.10.20.10/24 dev eth1
        - ip link set dev eth1 up
        - ip route replace default via 10.10.20.1 dev eth1

    iot:
      exec:
        - ip address replace 10.10.30.10/24 dev eth1
        - ip link set dev eth1 up
        - ip route replace default via 10.10.30.1 dev eth1

    servers:
      exec:
        - ip address replace 10.10.40.10/24 dev eth1
        - ip link set dev eth1 up
        - ip route replace default via 10.10.40.1 dev eth1

  links:
    - endpoints: ["router:eth1", "switch:eth1"]
    - endpoints: ["staff:eth1", "switch:eth2"]
    - endpoints: ["guest:eth1", "switch:eth3"]
    - endpoints: ["iot:eth1", "switch:eth4"]
    - endpoints: ["servers:eth1", "switch:eth5"]
